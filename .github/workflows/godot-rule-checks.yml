name: Godot rule checks

on:
  push:
    branches:
      - WOLF-DUSK-004-GODOT
  pull_request:
    branches:
      - WOLF-DUSK-004-GODOT
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Godot 4
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
      - name: Run rule tests
        run: godot --headless --path godot --script res://tests/validate_rules.gd
