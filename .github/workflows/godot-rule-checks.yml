name: Godot rule checks

on:
  push:
    branches:
      - WOLF-DUSK-004-GODOT
  pull_request:
    branches:
      - WOLF-DUSK-004-GODOT
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Godot 4
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
      - name: Import project and parse the 3D game scene
        run: |
          timeout 45s godot --headless --editor --path godot --quit
          timeout 20s godot --headless --path godot --quit-after 2
      - name: Run rule tests
        run: |
          echo 'Starting WOLF-DUSK rule validation'
          timeout 45s godot --headless --path godot --script res://tests/validate_rules.gd
          echo 'WOLF-DUSK rule validation finished'

  build-android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout isolated development branch
        uses: actions/checkout@v4
      - name: Verify Android export preset
        run: |
          test -f godot/export_presets.cfg
          grep -q 'name="Android"' godot/export_presets.cfg
      - name: Import and validate Godot project
        run: |
          godot --headless --editor --path godot --quit
          godot --headless --path godot --quit-after 2
      - name: Export Android debug APK
        run: |
          mkdir -p godot/build/android
          godot --headless --path godot --export-debug "Android" godot/build/android/wolf-dusk-debug.apk
          test -s godot/build/android/wolf-dusk-debug.apk
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wolf-dusk-android-debug-004
          path: godot/build/android/wolf-dusk-debug.apk
          if-no-files-found: error
          retention-days: 14
