name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'sheep_wolves_android_project.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: unzip -o sheep_wolves_android_project.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: sheep_wolves_android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sheep-wolves-debug-apk
          path: sheep_wolves_android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
