name: WOLF-DUSK-007 rule checks

on:
  push:
    branches:
      - WOLF-DUSK-007-REBUILD
      - WOLF-DUSK-008-FIX
      - WOLF-DUSK-035-CINEMATIC-REDESIGN
      - WOLF-DUSK-040-AI-LEVEL-AUDIT
      - WOLF-DUSK-041-AI-TACTICAL-INTELLIGENCE
      - WOLF-DUSK-044-CONT-004-VALIDATION
    paths:
      - 'rebuild/WOLF-DUSK-007/godot/**'
      - '.github/workflows/godot-007-rule-checks.yml'
  pull_request:
    branches:
      - WOLF-DUSK-007-REBUILD
      - WOLF-DUSK-008-FIX
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.4.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
      - name: Import and parse 3D scene
        run: |
          timeout 45s godot --headless --editor --path rebuild/WOLF-DUSK-007/godot --quit
          timeout 20s godot --headless --path rebuild/WOLF-DUSK-007/godot --quit-after 2
      - name: Run gameplay rule tests
        run: timeout 45s godot --headless --path rebuild/WOLF-DUSK-007/godot --script res://tests/validate_rules.gd
      - name: Run five-tier AI legality tests
        run: timeout 45s godot --headless --path rebuild/WOLF-DUSK-007/godot --script res://tests/validate_ai.gd
      - name: Run WOLF-DUSK-041 tactical regression tests
        run: timeout 60s godot --headless --path rebuild/WOLF-DUSK-007/godot --script res://tests/validate_ai_tactics.gd
