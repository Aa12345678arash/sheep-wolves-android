name: WOLF-DUSK-011 Mobile validation and APK

on:
  push:
    branches:
      - WOLF-DUSK-011-MOBILE-PERFORMANCE
      - WOLF-DUSK-AI-015
      - WOLF-DUSK-AI-017-PLAYER-CONTROL
      - WOLF-DUSK-AI-018-AI-TURN-CAMERA
      - WOLF-DUSK-AI-019-TOUCH-TARGETS
      - WOLF-DUSK-021-BOARD-NODE-EXPANSION
      - WOLF-DUSK-022-DIRECT-LAUNCH-ACCESSIBLE-UI
      - WOLF-DUSK-023-COLORFUL-FULLSCREEN-HUD
      - WOLF-DUSK-025-RESPONSIVE-PLAY-AREA
      - WOLF-DUSK-025-START-SCREEN-FULLSCREEN
      - WOLF-DUSK-029
      - WOLF-DUSK-030-START-SCREEN-VERTICAL-BALANCE
      - WOLF-DUSK-028-FIX-READABILITY
      - WOLF-DUSK-029
    paths:
      - 'rebuild/WOLF-DUSK-007/godot/**'
      - '.github/workflows/wolf-dusk-011-mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wolf-dusk-011-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout isolated development branch
        uses: actions/checkout@v4
      - name: Verify Android export preset
        run: |
          test -f rebuild/WOLF-DUSK-007/godot/export_presets.cfg
          grep -q 'name="Android"' rebuild/WOLF-DUSK-007/godot/export_presets.cfg
      - name: Configure Godot Android export environment
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates/4.4.1.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz -O /tmp/godot-templates.tpz
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          JAVA_BIN="$(readlink -f "$(command -v java)")"
          JAVA_HOME_DIR="$(dirname "$(dirname "$JAVA_BIN")")"
          if [ -n "${ANDROID_HOME:-}" ]; then
            ANDROID_SDK_DIR="$ANDROID_HOME"
          elif [ -n "${ANDROID_SDK_ROOT:-}" ]; then
            ANDROID_SDK_DIR="$ANDROID_SDK_ROOT"
          else
            ADB_BIN="$(find /opt /usr/local /usr/lib -type f -name adb 2>/dev/null | head -n 1)"
            test -n "$ADB_BIN"
            ANDROID_SDK_DIR="$(dirname "$(dirname "$ADB_BIN")")"
          fi
          SDKMANAGER="$(find "$ANDROID_SDK_DIR/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_DIR" --install "platform-tools" "platforms;android-33" "build-tools;33.0.2" < /dev/null
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "$JAVA_HOME_DIR"
          export/android/android_sdk_path = "$ANDROID_SDK_DIR"
          EOF
          keytool -genkeypair -v -keystore /tmp/wolf-dusk-debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          test -s "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk"
          test -s "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_release.apk"
      - name: Import and validate Godot project
        shell: bash
        run: |
          set -euxo pipefail
          PROJECT="$GITHUB_WORKSPACE/rebuild/WOLF-DUSK-007/godot"
          timeout --signal=TERM --kill-after=15s 300s godot --headless --editor --path "$PROJECT" --quit --verbose
          timeout --signal=TERM --kill-after=15s 90s godot --headless --path "$PROJECT" --quit-after 2 --verbose
          timeout --signal=TERM --kill-after=15s 120s godot --headless --path "$PROJECT" --script res://tests/validate_board.gd
          timeout --signal=TERM --kill-after=15s 120s godot --headless --path "$PROJECT" --script res://tests/validate_rules.gd
          timeout --signal=TERM --kill-after=15s 120s godot --headless --path "$PROJECT" --script res://tests/validate_ai.gd
          timeout --signal=TERM --kill-after=15s 120s godot --headless --path "$PROJECT" --script res://tests/validate_player_control.gd
          timeout --signal=TERM --kill-after=15s 120s godot --headless --path "$PROJECT" --script res://tests/validate_ui_readability.gd
          timeout --signal=TERM --kill-after=15s 120s godot --headless --path "$PROJECT" --script res://tests/validate_board_pads.gd
      - name: Export WOLF-DUSK-030 Android debug APK
        run: |
          godot --headless --verbose --path "$GITHUB_WORKSPACE/rebuild/WOLF-DUSK-007/godot" --export-debug "Android" "$GITHUB_WORKSPACE/wolf-dusk-030-preview.apk"
          test -s "$GITHUB_WORKSPACE/wolf-dusk-029-preview.apk"
      - name: Upload WOLF-DUSK-030 installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wolf-dusk-030-android-preview
          path: wolf-dusk-029-preview.apk
          if-no-files-found: error
          retention-days: 14

# Re-run validation after the narrow-phone panel width fix.
