name: WOLF-DUSK online worker validation
on:
  push:
    branches:
      - WOLF-DUSK-ONLINE-001-INVITE-ROOMS
    paths:
      - "rebuild/WOLF-DUSK-007/online/worker/**"
      - ".github/workflows/wolf-dusk-online-worker.yml"
  pull_request:
    paths:
      - "rebuild/WOLF-DUSK-007/online/worker/**"
      - ".github/workflows/wolf-dusk-online-worker.yml"
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rebuild/WOLF-DUSK-007/online/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rebuild/WOLF-DUSK-007/online/worker/package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run dry-run
